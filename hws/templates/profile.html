<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
</head>
<body>
    <h1>User Profile</h1>
    <p>Username: {{ user.username }}</p>
    <p>Email: {{ user.email }}</p>
    {% if user.photo_url %}
    <img src="{{ user.photo_url }}" alt="Profile Photo" width="200">
    {% endif %}
</body>
</html>
