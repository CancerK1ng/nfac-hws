<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>
    <h1>Your Cart</h1>
    <ul>
        {% for flower in flowers %}
        <li>{{ flower.name }} - ${{ flower.cost }}</li>
        {% endfor %}
    </ul>
    <p>Total: ${{ total }}</p>
    <form action="/purchased" method="post">
        <button type="submit">Purchase</button>
    </form>
</body>
</html>
