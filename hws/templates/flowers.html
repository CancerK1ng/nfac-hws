<!DOCTYPE html>
<html>
<head>
    <title>Flowers</title>
</head>
<body>
    <h1>Flowers</h1>
    <ul>
        {% for flower in flowers %}
        <li>
            {{ flower.name }} - ${{ flower.cost }} ({{ flower.count }} available)
            <form action="/cart/items" method="post">
                <input type="hidden" name="flower_id" value="{{ flower.id }}">
                <button type="submit">Add to cart</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    <h2>Add new flower</h2>
    <form action="/flowers" method="post">
        <input type="text" name="name" placeholder="Name" required>
        <input type="number" step="0.01" name="cost" placeholder="Cost" required>
        <input type="number" name="count" placeholder="Count" required>
        <button type="submit">Add Flower</button>
    </form>
</body>
</html>
